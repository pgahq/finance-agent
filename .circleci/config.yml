version: "2.1"
references:
  deploy_container_config: &deploy_container_config
    docker:
      - image: cimg/node:20.11.0
    working_directory: ~/app
    steps:
      - attach_workspace:
          at: ~/app
      - restore_cache:
          name: Load cached production dependencies
          keys:
            - prod-dependency-cache-{{ checksum "package-lock.json" }}
            - prod-dependency-cache-
      - run:
          name: Install production dependencies
          command: npm ci --production
      - save_cache:
          name: Cache production dependencies
          key: prod-dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: Install AWS CLI
          command: |
            cd
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
      - run:
          name: Package and upload lambda code
          command: >
            aws cloudformation package
            --template-file template.yml
            --s3-bucket $AWS_ARTIFACT_BUCKET
            --s3-prefix $CIRCLE_PROJECT_REPONAME
            --output-template-file packaged.yml
      - run:
          name: Install Google Cloud SDK
          command: |
            set -euo pipefail
            if [ -z "${FINANCE_AGENT_GCP_SERVICE_ACCOUNT_KEY:-}" ]; then
              echo "Skipping gcloud install; Gmail add-on publish will be skipped."
              exit 0
            fi
            curl -fsSL "https://dl.google.com/dl/cloudsdk/channels/rapid/google-cloud-sdk.tar.gz" -o /tmp/google-cloud-sdk.tar.gz
            tar -C "$HOME" -xzf /tmp/google-cloud-sdk.tar.gz
            echo 'export PATH="$HOME/google-cloud-sdk/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Resolve Gmail add-on authorization
          command: |
            set -euo pipefail
            if [ -z "${FINANCE_AGENT_GCP_SERVICE_ACCOUNT_KEY:-}" ]; then
              echo "Skipping OAuth client lookup."
              exit 0
            fi
            AUTH_JSON="$(bash scripts/deploy-gmail-addon.sh print-authorization)"
            CLIENT_ID="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.oauthClientId||"")' "${AUTH_JSON}")"
            SA_EMAIL="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.serviceAccountEmail||"")' "${AUTH_JSON}")"
            echo "export GMAIL_ADDON_OAUTH_CLIENT_ID='${CLIENT_ID}'" >> "$BASH_ENV"
            echo "export GMAIL_ADDON_SERVICE_ACCOUNT_EMAIL='${SA_EMAIL}'" >> "$BASH_ENV"
            echo "Using Workspace add-on OAuth client ${CLIENT_ID}"
            echo "Using Workspace add-on service account ${SA_EMAIL}"
      - run:
          name: Deploy CloudFormation template to AWS
          command: >
            aws cloudformation deploy
            --template-file packaged.yml
            --stack-name $CIRCLE_PROJECT_REPONAME
            --capabilities CAPABILITY_IAM
            --region us-east-1
            --role-arn $AWS_DEPLOY_ROLE_ARN
            --parameter-overrides
            LogLevel=$LOG_LEVEL
            WorkdayDomain=$WORKDAY_DOMAIN
            WorkdayTenant=$WORKDAY_TENANT
            FallbackFundId=$FALLBACK_FUND_ID
            FallbackPaymentTermsId=$FALLBACK_PAYMENT_TERMS_ID
            FallbackCostCenterId=$FALLBACK_COST_CENTER_ID
            InvoiceModEnabled=$INVOICE_MOD_ENABLED
            DefaultOcrSpendCategoryId=$FALLBACK_SPEND_CATEGORY_ID
            FallbackLineOfBusinessId=$FALLBACK_LOB_ID
            AddonEnvironment=$ADDON_ENVIRONMENT
            GmailAddonOauthClientId="${GMAIL_ADDON_OAUTH_CLIENT_ID}"
            GmailAddonServiceAccountEmail="${GMAIL_ADDON_SERVICE_ACCOUNT_EMAIL}"
      - run:
          name: Publish Gmail Workspace add-on
          command: |
            set -euo pipefail
            KEY="${FINANCE_AGENT_GCP_SERVICE_ACCOUNT_KEY:-}"
            if [ -z "${KEY}" ]; then
              echo "Skipping Gmail add-on gcloud deploy; add FINANCE_AGENT_GCP_SERVICE_ACCOUNT_KEY to this CircleCI context."
              exit 0
            fi
            GMAIL_ADDON_URL="$(aws cloudformation describe-stacks \
              --stack-name "$CIRCLE_PROJECT_REPONAME" \
              --region us-east-1 \
              --query "Stacks[0].Outputs[?OutputKey=='GmailAddonApiUrl'].OutputValue" \
              --output text)"
            export GMAIL_ADDON_URL
            bash scripts/deploy-gmail-addon.sh

jobs:
  build:
    working_directory: ~/app
    docker:
      - image: cimg/node:20.11.0
    steps:
      - checkout
      - restore_cache:
          name: Load cached dependencies
          keys:
            - dev-dependency-cache-{{ checksum "package.json" }}
            - dev-dependency-cache-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          name: Cache dependencies
          key: dev-dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules
      - run:
          name: Run tests
          environment:
            JEST_JUNIT_OUTPUT_DIR: reports
          command: |
            if [ "$CIRCLE_BRANCH" = "sandbox" ]; then
              npm test -- --ci --maxWorkers=2 --reporters=default --reporters=jest-junit || true
            else
              npm test -- --ci --maxWorkers=2 --reporters=default --reporters=jest-junit
            fi
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports
      - run:
          name: Build TypeScript
          command: npm run build
      - persist_to_workspace:
          root: ~/app
          paths:
            - dist
            - package.json
            - package-lock.json
            - template.yml
            - layers
            - scripts

  deploy-to-dev:
    <<: *deploy_container_config
    environment:
      LOG_LEVEL: DEBUG
      WORKDAY_DOMAIN: wd2-impl-services1.workday.com
      WORKDAY_TENANT: pgahq
      FALLBACK_FUND_ID: FUND-General_Fund_Unrestricted
      FALLBACK_PAYMENT_TERMS_ID: FALLBACK_PAYMENT_TERMS
      FALLBACK_COST_CENTER_ID: CC0000
      INVOICE_MOD_ENABLED: "true"
      FALLBACK_SPEND_CATEGORY_ID: Default_OCR_Spend_Category
      FALLBACK_LOB_ID: Default_Line_Of_Business
      ADDON_ENVIRONMENT: sandbox

  deploy-to-prod:
    <<: *deploy_container_config
    environment:
      LOG_LEVEL: DEBUG
      WORKDAY_DOMAIN: services1.myworkday.com
      WORKDAY_TENANT: pgahq
      FALLBACK_FUND_ID: FUND-General_Fund_Unrestricted
      FALLBACK_PAYMENT_TERMS_ID: FALLBACK_PAYMENT_TERMS
      FALLBACK_COST_CENTER_ID: CC0000
      INVOICE_MOD_ENABLED: "true"
      FALLBACK_SPEND_CATEGORY_ID: Default_OCR_Spend_Category
      FALLBACK_LOB_ID: Default_Line_Of_Business
      ADDON_ENVIRONMENT: production

workflows:
  version: 2
  build-deploy:
    jobs:
      - build
      - deploy-to-dev:
          context: chatbot-development
          requires:
            - build
          filters:
            branches:
              only: development
      - deploy-to-prod:
          context: chatbot-production
          requires:
            - build
          filters:
            branches:
              only: main
